[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvmvp-reproduction-extension"
version = "0.1.0"
description = "Reproduction and dynamic-covariance/CVaR extensions of TV-MVP"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
  "matplotlib>=3.7", "seaborn>=0.12", "PyYAML>=6.0", "yfinance>=0.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
